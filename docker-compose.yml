services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql_dispute_db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=TestApplication@123
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P TestApplication@123 -C -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql_dispute_init
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./TransactionDisputePortalApp/SQLScripts:/tmp/SQLScripts
    command: >
      /bin/bash -c "
      echo 'Executing database schema setup...' &&
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P 'TestApplication@123' -C -i /tmp/SQLScripts/init.sql &&
      echo 'Creating stored procedures...' &&
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P 'TestApplication@123' -C -i /tmp/SQLScripts/StoredProcs.sql &&
      echo 'Database initialization complete.'
      "

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transaction_dispute_api
    ports:
      - "8081:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=TransactionDispute;User Id=sa;Password=TestApplication@123;Encrypt=False;TrustServerCertificate=True;
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  web-app:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: transaction_dispute_portal
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_started